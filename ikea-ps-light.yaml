esphome:
  name: ikea-ps-light
  friendly_name: "IKEA PS Light"
  on_boot:
    priority: -100
    then:
      lambda: |-
        id(cover_status).publish_state("Unknown");

esp8266:
  board: d1_mini

# Enable loggings
logger:

# Enable Home Assistant API
api:
  password: ""

ota:
  password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ikea-Ps-Light Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:
    
servo:
  - id: light_servo
    output: pwm_output

output:
  - platform: esp8266_pwm
    id: pwm_output
    pin: D1
    frequency: 50 Hz

binary_sensor:
  - platform: gpio
    pin:
      number: D2
      mode:
        input: true
        pullup: true
      inverted: true
    name: Endstop
    id: endstop_switch
    icon: "mdi:electric-switch"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - servo.write:
            id: light_servo
            level: 0%
        - lambda: |-
            id(cover_status).publish_state("Open");

number:
  - platform: template
    id: close_delay
    name: Close delay
    min_value: 0
    max_value: 20000
    step: 100
    initial_value: 11000
    restore_value: true
    optimistic: true

button:
  - platform: template
    name: Open
    id: open_button
    icon: "mdi:arrow-expand-horizontal"
    on_press:
      - if:
          condition:
            binary_sensor.is_off: endstop_switch
          then:
            - lambda: |-
                id(cover_status).publish_state("Opening");
            - servo.write:
                id: light_servo
                level: -25%

  - platform: template
    name: Close
    id: close_button
    icon: "mdi:arrow-collapse-horizontal"
    on_press:
      - lambda: |-
          id(cover_status).publish_state("Closing");
      - servo.write:
          id: light_servo
          level: 25%
      - delay: !lambda "return id(close_delay).state;"
      - servo.write:
          id: light_servo
          level: 0%
      - lambda: |-
          id(cover_status).publish_state("Closed");
  
  - platform: template
    name: Stop
    id: stop_button
    icon: "mdi:stop"
    on_press:
      - servo.write:
          id: light_servo
          level: 0%

text_sensor:
  - platform: template
    name: "Cover status"
    id: cover_status
    update_interval: never
    lambda: |-
      return {};
